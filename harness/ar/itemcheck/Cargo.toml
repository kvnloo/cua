[package]
name = "ar-itemcheck"
version = "0.1.0"
edition = "2021"
publish = false
description = "Autoresearch G0: item-level allowlist checker for candidate Rust diffs (evaluator-owned)."

# Standalone: never part of the Driver workspace.
[workspace]

[[bin]]
name = "itemcheck"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
