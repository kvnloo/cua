name: "Evidence: Jev exact-head remote validation"

on:
  push:
    branches: [test/jev-remote-validation-20260924]
    paths: [.github/workflows/jev-remote-validation-20260924.yml]

permissions:
  contents: read

jobs:
  example-tests:
    if: github.repository == 'kvnloo/cua'
    name: "${{ matrix.name }}: full example suites"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backends-3961
            ref: 737cda114ae711713a3dbfa9c9ba76863dfd46b9
          - name: timing-4052
            ref: 5d3a55419194172b31f92cf2aa36b0b603ecac2a
    defaults:
      run:
        working-directory: libs/cua-driver/examples/jev-use
        shell: bash
    env:
      TYPESAFE_API_KEY: ""
      JEV_API_KEY: ""
      JEV_BACKEND: mock
      PYTHONUNBUFFERED: "1"
      # upload-artifact excludes directories starting with a dot by default.
      # Keep evidence non-hidden rather than enabling uploads of hidden files.
      EVIDENCE_DIR: ${{ github.workspace }}/remote-jev-evidence
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Record exact source identity
        env:
          EXPECTED_SOURCE: ${{ matrix.ref }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$EXPECTED_SOURCE" > "$EVIDENCE_DIR/source-sha.txt"
          printf '%s\n' "$WORKFLOW_SOURCE" > "$EVIDENCE_DIR/workflow-sha.txt"
          sha256sum uv.lock package-lock.json > "$EVIDENCE_DIR/lockfile-hashes.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked example dependencies
        run: |
          set -euo pipefail
          uv sync --frozen
          npm ci --ignore-scripts
          { python --version; node --version; npm --version; uv --version; } > "$EVIDENCE_DIR/tool-versions.txt"
      - name: Full Python example suite
        id: python
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --frozen python -m unittest discover -s python/tests -v 2>&1 | tee "$EVIDENCE_DIR/python-tests.log"
      - name: Credential-free chooser CLI
        id: chooser
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/typescript-tests.log"
      - name: Full TypeScript example suite
        id: typescript
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$EVIDENCE_DIR/typescript-tests.log"
      - name: TypeScript typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/typecheck.log"
      - name: Prove new tests detect the former selection bug
        id: regression
        if: matrix.name == 'backends-3961'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['EVIDENCE_DIR'])
          cases = [
              ('python', pathlib.Path('python/run.py'), '        default=None,', '        default="mock",', ['uv', 'run', '--frozen', 'python', '-m', 'unittest', 'discover', '-s', 'python/tests', '-p', 'test_runner_config.py', '-k', 'omitted_provider', '-v'], 'test_omitted_provider_preserves_environment_backend'),
              ('typescript', pathlib.Path('typescript/run.ts'), "  if (args.provider !== undefined) {\n    env.JEV_BACKEND = args.provider === 'live' ? 'typesafe' : args.provider;\n  }", "  env.JEV_BACKEND = args.provider === 'live' ? 'typesafe' : (args.provider ?? 'mock');", ['node', '--import', 'tsx', '--test', '--test-name-pattern=omitted runner provider', 'typescript/runner_config.test.ts'], 'omitted runner provider preserves environment backend'),
          ]
          results = []
          for name, path, old, new, command, test_name in cases:
              original = path.read_bytes()
              def check(label):
                  result = subprocess.run(command, capture_output=True, text=True, timeout=90)
                  log = result.stdout + result.stderr
                  (out / f'{name}-{label}.log').write_text(log)
                  assert test_name in log, f'{name}: intended test did not execute'
                  print(f'{name} {label}: exit={result.returncode}\n{log}')
                  return result.returncode, log
              try:
                  baseline, _ = check('regression-control')
                  assert baseline == 0, f'{name}: original must pass'
                  text = original.decode()
                  assert text.count(old) == 1, f'{name}: nonunique mutation anchor'
                  path.write_text(text.replace(old, new, 1))
                  broken, log = check('old-bug-restored')
                  assert broken != 0 and ('AssertionError' in log or 'ERR_ASSERTION' in log), f'{name}: old bug did not fail the intended assertion'
              finally:
                  path.write_bytes(original)
              restored, _ = check('restored-control')
              assert restored == 0, f'{name}: restored source must pass'
              results.append({'language': name, 'baseline_exit': baseline, 'old_bug_exit': broken, 'restored_exit': restored})
          (out / 'mutation-results.json').write_text(json.dumps(results, indent=2) + '\n')
          PY
      - name: Confirm tracked source is unchanged
        id: clean
        if: always()
        continue-on-error: true
        run: git diff --exit-code HEAD -- .
      - name: Summarize actual results
        if: always()
        env:
          SOURCE_SHA: ${{ matrix.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          CASE_NAME: ${{ matrix.name }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          CHOOSER_OUTCOME: ${{ steps.chooser.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          out = pathlib.Path(os.environ['EVIDENCE_DIR'])
          out.mkdir(exist_ok=True, parents=True)
          names = ['python', 'chooser', 'typescript', 'typecheck', 'clean']
          if os.environ['CASE_NAME'] == 'backends-3961':
              names.append('regression')
          outcomes = {name: os.environ.get(name.upper() + '_OUTCOME', '') for name in names}
          def read(name):
              path = out / name
              return path.read_text() if path.exists() else ''
          py = re.search(r'Ran (\d+) tests?', read('python-tests.log'))
          ts = re.search(r'# tests (\d+)', read('typescript-tests.log'))
          result = {'name': os.environ['CASE_NAME'], 'source_sha': os.environ['SOURCE_SHA'], 'workflow_sha': os.environ['WORKFLOW_SHA'], 'outcomes': outcomes, 'python_tests_run': int(py[1]) if py else None, 'typescript_tests_run': int(ts[1]) if ts else None, 'validation_checks_passed': all(v == 'success' for v in outcomes.values()), 'scope': 'Full checked-in Jev example suites, chooser CLI and full-example typecheck; backend candidate also runs configuration sensitivity controls', 'native_driver_build': 'NOT_RUN', 'desktop_browser_e2e': 'NOT_RUN', 'live_provider_validation': 'NOT_RUN', 'note': 'Test success and artifact delivery are separate gates. Mutation probes restore exact worktree bytes; no product source is pushed.'}
          text = json.dumps(result, indent=2)
          (out / 'result.json').write_text(text + '\n')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Exact-head example validation\n```json\n' + text + '\n```\n')
          PY
      - name: Inventory evidence bytes before upload
        if: always()
        run: |
          python - <<'PY'
          import hashlib, os, pathlib
          out = pathlib.Path(os.environ['EVIDENCE_DIR'])
          files = sorted(p for p in out.iterdir() if p.is_file() and p.suffix in ('.txt', '.json', '.log'))
          assert files and (out / 'result.json').is_file(), 'missing evidence summary'
          assert all(not p.name.startswith('.') for p in files)
          manifest = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files)
          (out / 'SHA256SUMS').write_text(manifest)
          print(manifest)
          PY
      - name: Retain logs and provenance
        id: evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: jev-${{ matrix.name }}-evidence
          path: |
            ${{ github.workspace }}/remote-jev-evidence/*.txt
            ${{ github.workspace }}/remote-jev-evidence/*.json
            ${{ github.workspace }}/remote-jev-evidence/*.log
            ${{ github.workspace }}/remote-jev-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Require validation and artifact delivery
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['EVIDENCE_DIR']) / 'result.json').read_text())
          assert result['validation_checks_passed'], result['outcomes']
          assert os.environ['ARTIFACT_ID'], 'validation passed but evidence was not uploaded'
          assert len(os.environ['ARTIFACT_DIGEST']) == 64, 'missing archive digest'
          print('Uploaded artifact', os.environ['ARTIFACT_ID'], 'SHA256', os.environ['ARTIFACT_DIGEST'])
          PY
