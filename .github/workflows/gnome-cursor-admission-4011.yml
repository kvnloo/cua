name: "Evidence: GNOME cursor admission #4011"

on:
  push:
    branches: [test/gnome-cursor-atomicity-4011]
    paths:
      - scripts/repro/gnome-cursor-admission-4011.py
      - .github/workflows/gnome-cursor-admission-4011.yml

permissions:
  contents: read

jobs:
  characterize:
    if: github.repository == 'kvnloo/cua'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 3
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /libs/cua-driver/rust/crates/platform-linux/src/wayland/shell_helper.rs
            /libs/cua-driver/rust/crates/platform-linux/src/overlay.rs
            /scripts/repro/gnome-cursor-admission-4011.py
      - name: Compile unchanged production excerpts and run desired-behavior test
        run: python3 scripts/repro/gnome-cursor-admission-4011.py
      - name: Record evidence summary
        if: always()
        run: |
          {
            echo '## Cursor admission characterization'
            echo 'This job succeeds only when four control cases pass and the desired atomic-update regression FAILS as predicted.'
            echo 'It is not a passing product acceptance test. No GNOME desktop, real helper, or upstream change is involved.'
            echo '```json'
            cat queue-evidence/result.json 2>/dev/null || echo '{"result":"infrastructure failure: inspect job log"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursor-admission-4011-evidence
          path: queue-evidence/
          if-no-files-found: error
          retention-days: 14
